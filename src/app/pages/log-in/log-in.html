<div class="flex min-h-screen w-full">
  <!-- LEFT: form column -->
  <div class="flex w-full flex-1 flex-col lg:w-1/2">
    <div class="mx-auto mb-5 w-full max-w-md sm:pt-10"></div>

    <div
      class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 sm:px-0"
    >
      <div>
        <div class="mb-5 sm:mb-8">
          <h1
            class="sm:text-title-md mb-2 text-title-sm font-semibold text-gray-800 dark:text-white/90"
          >
            Sign In
          </h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">
            Enter your email and password to sign in!
          </p>
        </div>

        <div>
          <!-- Social buttons -->
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-5">
            <button
              type="button"
              class="inline-flex items-center justify-center gap-3 rounded-lg bg-gray-100 px-7 py-3 text-sm font-normal text-gray-700 transition-colors hover:bg-gray-200 hover:text-gray-800 dark:bg-white/5 dark:text-white/90 dark:hover:bg-white/10"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M18.7511 10.1944C18.7511 9.47495 18.6915 8.94995 18.5626 8.40552H10.1797V11.6527H15.1003C15.0011 12.4597 14.4654 13.675 13.2749 14.4916L13.2582 14.6003L15.9087 16.6126L16.0924 16.6305C17.7788 15.1041 18.7511 12.8583 18.7511 10.1944Z"
                  fill="#4285F4"
                />
                <path
                  d="M10.1788 18.75C12.5895 18.75 14.6133 17.9722 16.0915 16.6305L13.274 14.4916C12.5201 15.0068 11.5081 15.3666 10.1788 15.3666C7.81773 15.3666 5.81379 13.8402 5.09944 11.7305L4.99473 11.7392L2.23868 13.8295L2.20264 13.9277C3.67087 16.786 6.68674 18.75 10.1788 18.75Z"
                  fill="#34A853"
                />
                <path
                  d="M5.10014 11.7305C4.91165 11.186 4.80257 10.6027 4.80257 9.99992C4.80257 9.3971 4.91165 8.81379 5.09022 8.26935L5.08523 8.1534L2.29464 6.02954L2.20333 6.0721C1.5982 7.25823 1.25098 8.5902 1.25098 9.99992C1.25098 11.4096 1.5982 12.7415 2.20333 13.9277L5.10014 11.7305Z"
                  fill="#FBBC05"
                />
                <path
                  d="M10.1789 4.63331C11.8554 4.63331 12.9864 5.34303 13.6312 5.93612L16.1511 3.525C14.6035 2.11528 12.5895 1.25 10.1789 1.25C6.68676 1.25 3.67088 3.21387 2.20264 6.07218L5.08953 8.26943C5.81381 6.15972 7.81776 4.63331 10.1789 4.63331Z"
                  fill="#EB4335"
                />
              </svg>
              Sign in with Google
            </button>
            <button
              type="button"
              class="inline-flex items-center justify-center gap-3 rounded-lg bg-gray-100 px-7 py-3 text-sm font-normal text-gray-700 transition-colors hover:bg-gray-200 hover:text-gray-800 dark:bg-white/5 dark:text-white/90 dark:hover:bg-white/10"
            >
              <svg
                width="21"
                class="fill-current"
                height="20"
                viewBox="0 0 21 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15.6705 1.875H18.4272L12.4047 8.75833L19.4897 18.125H13.9422L9.59717 12.4442L4.62554 18.125H1.86721L8.30887 10.7625L1.51221 1.875H7.20054L11.128 7.0675L15.6705 1.875ZM14.703 16.475H16.2305L6.37054 3.43833H4.73137L14.703 16.475Z"
                />
              </svg>
              Sign in with X
            </button>
          </div>

          <!-- Divider -->
          <div class="relative py-5">
            <div class="absolute inset-0 flex items-center">
              <div
                class="w-full border-t border-gray-200 dark:border-gray-800"
              ></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span
                class="bg-white px-4 text-gray-500 dark:bg-gray-900 dark:text-gray-400"
              >
                Or
              </span>
            </div>
          </div>

          <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
            <div class="space-y-5">
              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                >
                  Email <span class="text-red-500">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  email
                  [ngModel]="email()"
                  (ngModelChange)="email.set($event)"
                  #emailCtrl="ngModel"
                  placeholder="info@gmail.com"
                  class="h-11 w-full rounded-lg border bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                  [class.border-gray-300]="!emailCtrl.invalid || !emailCtrl.touched"
                  [class.dark:border-gray-700]="!emailCtrl.invalid || !emailCtrl.touched"
                  [class.border-red-500]="emailCtrl.invalid && emailCtrl.touched"
                  [class.focus:border-brand-300]="!emailCtrl.invalid"
                  [class.focus:ring-brand-500/10]="!emailCtrl.invalid"
                  [class.dark:focus:border-brand-800]="!emailCtrl.invalid"
                />
                @if (emailCtrl.invalid && emailCtrl.touched) {
                <p class="mt-1.5 text-xs text-red-500">
                  Please enter a valid email.
                </p>
                }
              </div>

              <!-- Password -->
              <div>
                <label
                  for="password"
                  class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                >
                  Password <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                  <input
                    [type]="showPassword() ? 'text' : 'password'"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                    [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                    #passwordCtrl="ngModel"
                    placeholder="Enter your password"
                    class="h-11 w-full rounded-lg border border-gray-300 bg-transparent py-2.5 ps-4 pe-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                  />
                  <button
                    type="button"
                    (click)="togglePassword()"
                    class="absolute top-1/2 right-4 z-30 -translate-y-1/2 cursor-pointer text-gray-500 rtl:right-auto rtl:left-4 dark:text-gray-400"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                    [attr.aria-pressed]="showPassword()"
                  >
                    @if (!showPassword()) {
                    <svg
                      class="fill-current"
                      width="20"
                      height="20"
                      viewBox="0 0 20 20"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M4.638 3.577a.75.75 0 00-1.06 1.06l1.275 1.277a8.03 8.03 0 00-2.437 3.545.75.75 0 000 .487 8.019 8.019 0 0011.083 4.614l1.864 1.863a.75.75 0 101.06-1.06L4.638 3.576zm7.723 9.844l-1.914-1.913c-.14.034-.289.053-.44.053h-.015a1.858 1.858 0 01-1.803-2.312l-2.27-2.27a6.532 6.532 0 00-1.996 2.723 6.518 6.518 0 008.438 3.72zm3.716-3.719a6.516 6.516 0 01-1.257 2.03l1.061 1.06a8.012 8.012 0 001.704-2.846.75.75 0 000-.487A8.019 8.019 0 007.522 4.433l1.23a6.519 6.519 0 017.326 4.04z"
                        fill="currentColor"
                      />
                    </svg>
                    } @else {
                    <svg
                      class="fill-current"
                      width="20"
                      height="20"
                      viewBox="0 0 20 20"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M10 13.862a6.519 6.519 0 01-6.077-4.16 6.519 6.519 0 0112.154 0A6.519 6.519 0 0110 13.862zm0-9.819a8.019 8.019 0 00-7.585 5.416.75.75 0 000 .487 8.019 8.019 0 0015.17 0 .75.75 0 000-.487A8.019 8.019 0 0010 4.043zm-.008 3.801a1.858 1.858 0 100 3.716h.014a1.858 1.858 0 000-3.716h-.014z"
                        fill="currentColor"
                      />
                    </svg>
                    }
                  </button>
                </div>
                @if (passwordCtrl.invalid && passwordCtrl.touched) {
                <p class="mt-1.5 text-xs text-red-500">
                  Password must be at least 6 characters.
                </p>
                }
              </div>

              <!-- Checkbox & Link -->
              <div class="flex items-center justify-between">
                <label
                  for="keep-logged-in"
                  class="flex cursor-pointer items-center text-sm font-normal text-gray-700 select-none dark:text-gray-400"
                >
                  <div class="relative">
                    <input
                      type="checkbox"
                      id="keep-logged-in"
                      class="sr-only"
                      [checked]="keepLoggedIn()"
                      (change)="toggleKeepLoggedIn()"
                    />
                    <div
                      class="mr-3 flex h-5 w-5 items-center justify-center rounded-md border-[1.25px] rtl:mr-0 rtl:ml-3"
                      [class.border-brand-500]="keepLoggedIn()"
                      [class.bg-brand-500]="keepLoggedIn()"
                      [class.bg-transparent]="!keepLoggedIn()"
                      [class.border-gray-300]="!keepLoggedIn()"
                      [class.dark:border-gray-700]="!keepLoggedIn()"
                    >
                      <span [class.opacity-0]="!keepLoggedIn()">
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 14 14"
                          fill="none"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path
                            d="M11.6666 3.5L5.24992 9.91667L2.33325 7"
                            stroke="white"
                            stroke-width="1.94437"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                        </svg>
                      </span>
                    </div>
                  </div>
                  Keep me logged in
                </label>
                <a
                  routerLink="/reset-password"
                  class="text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400"
                >
                  Forgot password?
                </a>
              </div>

              <!-- Button -->
              <div>
                <button
                  type="submit"
                  [disabled]="loginForm.invalid"
                  class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
                >
                  Sign In
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: image column -->
  <div
    class="relative hidden w-1/2 lg:flex lg:items-center lg:justify-center lg:p-12"
  >
    <img
      src="/assets/images/plug_me_logo_services.jpeg"
      alt="Plug Me dashboard preview"
      class="max-h-[600px] w-full max-w-md rounded-2xl object-cover shadow-lg"
    />
  </div>
</div>
